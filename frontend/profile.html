<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Profile</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css" />

  <script src="https://code.jquery.com/jquery-3.6.4.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- common -->
<script src="js/header.js"></script>

  <!-- page -->
  <script src="js/profile.js"></script>
</head>
<body id="profile">
  <div id="header"></div>

  <div class="container">
      <h1 class="mt-3 text-center">User Profile</h1>
    <form id="profileForm" enctype="multipart/form-data">
  <div class="form-group">
    <label for="avatar">Avatar:</label>
    <input type="file" id="avatar" name="image" accept="image/*" class="form-control" disabled /> <!-- added disabled -->
    <img id="avatarPreview" src="" alt="Avatar Preview" style="display:none;max-width:120px;margin-top:10px;" />
  </div>
  <div class="form-group"><label>First Name:</label><input type="text" id="firstName" name="fname" class="form-control" readonly /><div class="invalid-feedback">First name is required.</div></div>
  <div class="form-group"><label>Last Name:</label><input type="text" id="lastName" name="lname" class="form-control" readonly /><div class="invalid-feedback">Last name is required.</div></div>
  <div class="form-group"><label>Address:</label><input type="text" id="address" name="addressline" class="form-control" readonly /><div class="invalid-feedback">Address is required.</div></div>
  <div class="form-group"><label>Phone:</label><input type="text" id="phone" name="phone" class="form-control" readonly /><div class="invalid-feedback">Phone is required.</div></div>
  <div class="form-group"><label>Postcode:</label><input type="text" id="zipcode" name="zipcode" class="form-control" readonly /><div class="invalid-feedback">Postcode is required.</div></div>

  <button type="button" id="editBtn" class="btn btn-secondary">Edit</button>            <!-- new -->
  <button type="submit" id="updateBtn" class="btn btn-primary" style="display:none;">Submit</button> <!-- added style:none -->
  <button type="button" id="cancelBtn" class="btn btn-outline-secondary" style="display:none;">Cancel</button> <!-- new -->
</form>
  </div>
</body>
</html>
