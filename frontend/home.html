<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Home</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
    crossorigin="anonymous"
  />
  <link href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.css"
  />
  <link rel="stylesheet" href="css/style.css" />

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"
    integrity="sha256-oP6HI9z1XaZNBrJURtCoUT5SUnxFr8s3BzRl+cbzUq8="
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
    crossorigin="anonymous"></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.min.js"
  ></script>

  <script src="js/header.js"></script>
  <script src="js/home.js"></script>
</head>
<body>
  <div id="header"></div>

  <div class="container my-5">
    <div class="row">
      <!-- Sidebar Filters: Left Column -->
      <aside class="col-lg-3 mb-4">
        <div class="filter-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="filter-title m-0">Filters</span>
            <button id="clearFiltersBtn" class="btn-clear-filters">Clear All</button>
          </div>

          <!-- Brands Filter Panel -->
          <div class="mb-4">
            <div class="filter-section-header">Brands</div>
            <div class="dropdown">
              <button class="btn filter-dropdown-toggle" type="button" id="brandFilterDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Select Brands <i class="fas fa-chevron-down small text-muted"></i>
              </button>
              <div class="dropdown-menu filter-dropdown-menu" aria-labelledby="brandFilterDropdown" id="brandFilterList">
                <label class="filter-checkbox-label">
                  <input type="checkbox" class="brand-filter-checkbox" value="" checked>
                  All Brands
                </label>
                <!-- brand dynamic options injected here -->
              </div>
            </div>
          </div>

          <!-- Categories Filter Panel -->
          <div class="mb-4">
            <div class="filter-section-header">Categories</div>
            <div class="dropdown">
              <button class="btn filter-dropdown-toggle" type="button" id="categoryFilterDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                Select Categories <i class="fas fa-chevron-down small text-muted"></i>
              </button>
              <div class="dropdown-menu filter-dropdown-menu" aria-labelledby="categoryFilterDropdown" id="categoryFilterList">
                <label class="filter-checkbox-label">
                  <input type="checkbox" class="category-filter-checkbox" value="" checked>
                  All Categories
                </label>
                <!-- category dynamic options injected here -->
              </div>
            </div>
          </div>

          <!-- Price Range Filter Panel -->
          <div class="mb-4">
            <div class="filter-section-header">Price Range</div>
            <div class="price-input-group mb-3">
              <input type="number" id="minPriceInput" class="form-control" placeholder="Min ₱" min="0">
              <span class="text-muted">–</span>
              <input type="number" id="maxPriceInput" class="form-control" placeholder="Max ₱" min="0">
            </div>
          </div>

          <button id="applyFiltersBtn" class="btn btn-block btn-apply-filters">
            Apply Filters
          </button>
        </div>
      </aside>

      <!-- Main Catalogue and Search: Right Column -->
      <main class="col-lg-9">
        <div class="top-search-bar">
          <h1 class="h3 font-weight-bold mb-0 text-dark">Shop Products</h1>
          
          <div class="search-wrapper">
            <input
              type="text"
              id="productSearch"
              class="form-control"
              placeholder="Search products..."
              autocomplete="off"
            />
            <div id="searchResults" class="search-dropdown"></div>
          </div>
        </div>

        <div id="items"></div>

        <!-- Loading spinner shown while fetching a page -->
        <div id="itemsLoading" class="text-center py-4 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
          </div>
          <p class="text-muted mt-2 mb-0">Loading more products...</p>
        </div>

        <!-- Shown only if a page request fails -->
        <div id="itemsError" class="text-center py-4 d-none">
          <p class="text-danger mb-2">Failed to load products.</p>
          <button type="button" id="itemsRetryBtn" class="btn btn-outline-primary btn-sm">Retry</button>
        </div>

        <!-- Shown once there are no more pages left -->
        <div id="itemsEnd" class="text-center py-4 d-none">
          <p class="text-muted mb-0">You've reached the end — no more products to show.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Back to top button, appears after scrolling down -->
  <button id="backToTop" class="btn rounded-circle d-none">↑</button>
</body>
</html>
