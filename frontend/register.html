<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Register</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css" />

  <script src="https://code.jquery.com/jquery-3.6.4.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>

  <!-- common -->
  <script src="js/header.js"></script>

  <!-- page -->
  <script src="js/auth/register.js"></script>
</head>
<body style="background-color: #f8f9fa;">
  <div id="header"></div>

  <div class="container" style="margin-top: 60px; margin-bottom: 60px;">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
            <form id="registerForm">
              <h2 class="text-center mb-4" style="color: #2c3550; font-weight: bold; letter-spacing: 0.5px;">Register</h2>

              <!-- Row container to place First Name and Last Name side-by-side -->
              <div class="form-row" style="margin-bottom: 20px;">
                <div class="col-6">
                  <label for="firstname" style="font-weight: 500; color: #4a5568; font-size: 14px;">First Name</label>
                  <input type="text" id="firstname" name="firstname" class="form-control" style="padding: 10px; height: auto;" placeholder="Your First Name" />
                </div>
                <div class="col-6">
                  <label for="lastname" style="font-weight: 500; color: #4a5568; font-size: 14px;">Last Name</label>
                  <input type="text" id="lastname" name="lastname" class="form-control" style="padding: 10px; height: auto;" placeholder="Your Last Name" />
                </div>
              </div>

              <div class="form-group" style="margin-bottom: 20px;">
                <label for="email" style="font-weight: 500; color: #4a5568; font-size: 14px;">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" style="padding: 10px; height: auto;" placeholder="name@example.com" />
              </div>

              <div class="form-group" style="margin-bottom: 28px;">
                <label for="password" style="font-weight: 500; color: #4a5568; font-size: 14px;">Password</label>
                <input type="password" id="password" name="password" class="form-control" style="padding: 10px; height: auto;" placeholder="••••••••" />
              </div>

              <button type="submit" id="register" style="width: 100%; padding: 12px; background: #2c3550; color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 16px; cursor: pointer; transition: background 0.2s;">
                Register
              </button>

              <p class="mt-4 mb-0 text-center" style="color: #4a5568; font-size: 14px;">
                Already have an account?
                <a href="login.html" style="color: #2c3550; font-weight: 600; text-decoration: none;">Login</a>
              </p>
            </form>
      </div>
    </div>
  </div>
</body>
</html>
