    <main class="admin-content">
      <h2 class="mt-3 text-center">Order Management</h2>

      <div class="table-responsive">
        <table id="ordersTable" class="table table-striped table-bordered" style="width:100%">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Email</th>
              <th>Total</th>
              <th>Status</th>
              <th>Placed On</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="modal fade" id="ordersModal" role="dialog" style="display:none">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h4 class="modal-title">Update order status</h4>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>

            <div class="modal-body">
              <form id="ordersForm">
                <div class="form-group">
                  <label for="orderIdField">Order ID</label>
                  <input type="text" id="orderIdField" class="form-control" readonly />
                </div>

                <div class="form-group">
                  <label for="orderCustomer">Customer</label>
                  <input type="text" id="orderCustomer" class="form-control" readonly />
                </div>

                <div class="form-group">
                  <label for="orderTotal">Total</label>
                  <input type="text" id="orderTotal" class="form-control" readonly />
                </div>

                <div class="form-group">
                  <label for="orderStatus">Status</label>
                  <select id="orderStatus" class="form-control">
                    <option value="processing">Processing</option>
                    <option value="shipped">Shipped</option>
                    <option value="delivered">Delivered</option>
                    <option value="cancelled">Cancelled</option>
                  </select>
                </div>
              </form>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
              <button id="orderUpdateBtn" type="button" class="btn btn-primary">Update</button>
            </div>
          </div>
        </div>
      </div>
    </main>

      sessionStorage.clear();
