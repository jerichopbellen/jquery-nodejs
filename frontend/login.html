<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css" />

  <script src="https://code.jquery.com/jquery-3.6.4.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.16.1/sweetalert2.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
  
  <script src="js/header.js"></script>
  <script src="js/auth/login.js"></script>
</head>
<body>
  <div id="header"></div>

  <form id="loginForm" style="max-width: 400px; margin: 30px auto">
    <h2>Login</h2>

    <div style="margin-bottom: 15px">
      <label for="email">Email:</label><br />
      <input type="email" id="email" name="email" style="width: 100%; padding: 8px" />
    </div>

    <div style="margin-bottom: 15px">
      <label for="password">Password:</label><br />
      <div style="position: relative;">
        <input type="password" id="password" name="password" style="width: 100%; padding: 8px; padding-right: 40px;" />
        <button type="button" id="togglePassword" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center;">
          <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" id="login" style="width: 100%; padding: 10px; background: #007bff; color: #fff; border: none; border-radius: 4px;">
      Login
    </button>

    <p class="mt-3 mb-0 text-center">
      Don’t have an account?
      <a href="register.html">Register</a>
    </p>
  </form>
</body>
</html>
